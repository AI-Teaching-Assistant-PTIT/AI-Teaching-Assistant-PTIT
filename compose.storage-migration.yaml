# Optional overlay for reading an existing MinIO volume through S3.
# Never used by normal starts; requires a cached legacy image and existing volume.
services:
  minio-legacy:
    profiles: [storage-migration]
    image: ${MINIO_LEGACY_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    pull_policy: never
    restart: "no"
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes:
      - legacy-minio-data:/data
    networks:
      - platform_net

volumes:
  legacy-minio-data:
    external: true
    name: ${MINIO_LEGACY_VOLUME:-platform_minio_data}
